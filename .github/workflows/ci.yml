name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 build components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run JavaScript smoke tests
        run: node --test tests/js/smoke.test.mjs

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run Android APK smoke test
        env:
          READLINGO_SKIP_GRADLE_BUILD: '1'
        run: tools/android-smoke-test.sh
